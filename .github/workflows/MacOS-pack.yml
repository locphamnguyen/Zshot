name: Packaging(MacOS)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "docs/**"

  pull_request:
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "docs/**"
      - "data/translations/*.ts"

  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT: zshot
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  dmg-pack:
    name: Build dmg on ${{ matrix.dist.os }} ${{ matrix.dist.arch }}

    strategy:
      fail-fast: false
      matrix:
        dist:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: intel

    runs-on: ${{ matrix.dist.os }}

    env:
      APP_NAME: zshot
      DIR_BUILD: build
      # Developer ID signing + notarization only when the secrets exist
      # (pull requests from forks get none and fall back to ad hoc signing).
      CAN_SIGN: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.NOTARY_KEY_P8_BASE64 != '' }}

    steps:
      - name: Checkout Source code
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Checkout Source code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout Source code
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set env & Print flameshot version
        shell: bash
        run: |
          last_committed_tag=$(git tag -l --sort=-v:refname | head -1)
          git_revno=$(git rev-list $(git describe --tags --abbrev=0)..HEAD --count)
          git_hash=$(git rev-parse --short HEAD)
          ver_info=${last_committed_tag}+git${git_revno}.${git_hash}

          echo "=======FLAMESHOT VERSION========"
          echo ${last_committed_tag:1}
          echo "Details: ${ver_info}"
          echo "================================"

          echo "VERSION=$(grep 'set.*(.*FLAMESHOT_VERSION' CMakeLists.txt | sed 's/[^0-9.]*//' | sed 's/)//g')" >> $GITHUB_ENV
          echo "VER_INFO=${ver_info}" >> $GITHUB_ENV
          echo "GIT_HASH=${git_hash}" >> $GITHUB_ENV

      - name: Install Qt
        run: brew install qt@6

      - name: Print build environment
        run: |
          echo "Deployment target: ${MACOSX_DEPLOYMENT_TARGET}"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          clang --version
          cmake --version
          brew info qt@6
          brew --prefix qt@6

      - name: Configure
        run: |
          rm -rf "${DIR_BUILD}"/src/*.dmg
          rm -rf "${DIR_BUILD}/src/zshot.app"

          cmake \
            -GNinja \
            -S . \
            -B "${DIR_BUILD}" \
            -DQt6_DIR="$(brew --prefix qt@6)/lib/cmake/Qt6" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"

      - name: Show CMake deployment target
        run: |
          grep CMAKE_OSX_DEPLOYMENT_TARGET "${DIR_BUILD}/CMakeCache.txt" || true

      - name: Compile
        run: |
          cmake --build "${DIR_BUILD}"

      - name: Inspect resulting executable
        run: |
          otool -l "${DIR_BUILD}/src/zshot.app/Contents/MacOS/zshot" | \
            sed -n '/LC_BUILD_VERSION/,/cmd/p'

      - name: Import Developer ID certificate
        if: env.CAN_SIGN == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/zshot-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          CERT_FILE="${RUNNER_TEMP}/zshot-cert.p12"

          printf '%s' "${CERT_P12_BASE64}" | base64 --decode > "${CERT_FILE}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${CERT_FILE}" -P "${CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          rm -f "${CERT_FILE}"

          # Intermediate CA for Developer ID certificates, in case the
          # runner image does not ship it.
          curl -fsSL -o "${RUNNER_TEMP}/DeveloperIDG2CA.cer"             https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "${RUNNER_TEMP}/DeveloperIDG2CA.cer" -k "${KEYCHAIN}" || true
          rm -f "${RUNNER_TEMP}/DeveloperIDG2CA.cer"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s             -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}"             $(security list-keychains -d user | tr -d '"')

          echo "Code signing identities in the temporary keychain:"
          security find-identity -v -p codesigning "${KEYCHAIN}" | tail -1
          echo "SIGN_KEYCHAIN=${KEYCHAIN}" >> "$GITHUB_ENV"

      - name: Sign app bundle with Developer ID
        if: env.CAN_SIGN == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          bash packaging/macos/sign_app.sh             "${DIR_BUILD}/src/zshot.app" "${SIGN_IDENTITY}" "${SIGN_KEYCHAIN}"

      - name: Build dmg package
        env:
          SIGN_IDENTITY: ${{ env.CAN_SIGN == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: |
          # Call the packaging script directly rather than `ninja create_dmg`
          # so the build cannot re-run and overwrite the Developer ID
          # signature applied above. Empty identity => ad hoc signed DMG.
          bash packaging/macos/create_dmg.sh             "${DIR_BUILD}/src/zshot.app"             "${DIR_BUILD}/src/Zshot-${VERSION}-${{ matrix.dist.arch }}.dmg"             "${SIGN_IDENTITY}"             "${SIGN_IDENTITY}"

      - name: Notarize and staple dmg
        if: env.CAN_SIGN == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY_FILE="${RUNNER_TEMP}/zshot-notary-key.p8"
          printf '%s' "${NOTARY_KEY_P8_BASE64}" | base64 --decode > "${KEY_FILE}"
          bash packaging/macos/notarize_dmg.sh             "${DIR_BUILD}/src/Zshot-${VERSION}-${{ matrix.dist.arch }}.dmg"             "${KEY_FILE}" "${NOTARY_KEY_ID}" "${NOTARY_ISSUER_ID}"

      - name: Remove signing keychain and keys
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/zshot-notary-key.p8" "${RUNNER_TEMP}/zshot-cert.p12"
          if [ -n "${SIGN_KEYCHAIN:-}" ] && [ -f "${SIGN_KEYCHAIN}" ]; then
            security delete-keychain "${SIGN_KEYCHAIN}" || true
          fi

      - name: Artifact Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PRODUCT }}-${{ env.VER_INFO }}-artifact-macos-${{ matrix.dist.arch }}
          path: ${{ github.workspace }}/build/src/Zshot-${{ env.VERSION }}-${{ matrix.dist.arch }}.dmg
          overwrite: true

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/build/src/Zshot-${{ env.VERSION }}-${{ matrix.dist.arch }}.dmg
